openapi: 3.1.0
info:
  title: RailVision AI API
  version: 0.4.0
  description: >
    Contrato REST do backend Python + FastAPI do RailVision AI.
    Novas inspeções executam detecção real (PyTorch CUDA por padrão) e rastreamento ByteTrack sobre vídeos locais;
    campos de material e nível ordinal permanecem marcados como not_evaluated até treinamento da Fase 5.
servers:
  - url: http://127.0.0.1:8080
    description: Servidor local MVP
paths:
  /health:
    get:
      summary: Sonda simplificada de disponibilidade da API FastAPI
      operationId: getHealth
      responses:
        "200":
          description: Estado básico de execução
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /actuator/health:
    get:
      summary: Sonda detalhada de prontidão (armazenamento e PostgreSQL)
      operationId: getActuatorHealth
      responses:
        "200":
          description: Todos os componentes operacionais (UP)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActuatorHealthResponse"
        "503":
          description: Armazenamento ou PostgreSQL indisponível (DOWN)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActuatorHealthResponse"
  /api/v1/inspections:
    get:
      summary: Listar inspeções
      operationId: listInspections
      responses:
        "200":
          description: Lista de inspeções ordenada da mais recente para a mais antiga
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InspectionSummary"
    post:
      summary: Criar inspeção com upload de vídeo
      operationId: createInspection
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                title:
                  type: string
                  maxLength: 200
                notes:
                  type: string
                  maxLength: 2000
      responses:
        "201":
          description: Inspeção criada
          headers:
            Location:
              description: URL absoluta da inspeção recém-criada
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InspectionSummary"
        "400":
          description: Arquivo ausente, nome/notas inválidos ou formato/assinatura não suportados
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "413":
          description: Arquivo excede o limite configurado
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
  /api/v1/inspections/{id}:
    get:
      summary: Obter detalhes da inspeção
      operationId: getInspectionById
      parameters:
        - $ref: "#/components/parameters/UuidPathId"
      responses:
        "200":
          description: Detalhes da inspeção
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InspectionDetail"
        "404":
          description: Inspeção não encontrada
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
  /api/v1/inspections/{id}/process:
    post:
      summary: Iniciar ou reprocessar inspeção de forma assíncrona
      operationId: processInspection
      parameters:
        - $ref: "#/components/parameters/UuidPathId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProcessInspectionRequest"
      responses:
        "202":
          description: Job enfileirado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcessingJobResponse"
        "400":
          description: Parâmetro de runtime ou modelo inválido
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          description: Inspeção não encontrada
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "409":
          description: Já existe um processamento ativo para esta inspeção
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
  /api/v1/inspections/{id}/media:
    get:
      summary: Reproduzir mídia da inspeção com suporte a HTTP Range
      operationId: streamInspectionMedia
      parameters:
        - $ref: "#/components/parameters/UuidPathId"
        - name: Range
          in: header
          required: false
          schema:
            type: string
          example: bytes=0-1048575
      responses:
        "200":
          description: Fluxo completo do vídeo
        "206":
          description: Trecho parcial do vídeo
        "404":
          description: Mídia não encontrada
        "416":
          description: Intervalo de bytes inválido
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
  /api/v1/inspections/{id}/wagons:
    get:
      summary: Listar resultados consolidados de vagões do último job concluído
      operationId: listInspectionWagons
      parameters:
        - $ref: "#/components/parameters/UuidPathId"
      responses:
        "200":
          description: Lista ordenada por sequenceIndex
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WagonResultResponse"
        "404":
          description: Inspeção não encontrada
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
  /api/v1/inspections/{id}/wagons/{wagonId}:
    get:
      summary: Obter resultado consolidado de um vagão específico
      operationId: getInspectionWagon
      parameters:
        - $ref: "#/components/parameters/UuidPathId"
        - name: wagonId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Resultado do vagão
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WagonResultResponse"
        "404":
          description: Inspeção ou vagão não encontrado
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
  /api/v1/inspections/{id}/wagons/{wagonId}/observations:
    get:
      summary: Listar observações de um vagão consolidado
      operationId: listWagonObservations
      parameters:
        - $ref: "#/components/parameters/UuidPathId"
        - name: wagonId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Observações por frame/timestamp
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WagonObservationResponse"
        "404":
          description: Inspeção ou vagão não encontrado
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
  /api/v1/jobs/{id}:
    get:
      summary: Consultar status de job de processamento
      operationId: getJobStatus
      parameters:
        - $ref: "#/components/parameters/UuidPathId"
      responses:
        "200":
          description: Estado do job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcessingJobResponse"
        "404":
          description: Job não encontrado
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
  /api/v1/models:
    get:
      summary: Listar versões de modelo registradas no banco
      operationId: listModelVersions
      parameters:
        - name: includePlaceholders
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Versões de modelo
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ModelVersionResponse"
  /api/v1/models/checkpoints:
    get:
      summary: Listar checkpoints locais disponíveis no Model Registry
      operationId: listRegisteredCheckpoints
      responses:
        "200":
          description: Checkpoints selecionáveis pelo Laboratório de Visão e por inspeções
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RegisteredCheckpoint"
  /api/v1/vision-lab/status:
    get:
      summary: Diagnóstico de hardware, runtime ativo e opções do Laboratório de Visão
      description: Alias retrocompatível disponível em /api/v1/onnx-spike/status
      operationId: getVisionLabStatus
      responses:
        "200":
          description: Diagnóstico atual de runtime e modelos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeStatus"
  /api/v1/vision-lab/analyze-image:
    post:
      summary: Executar inferência síncrona em uma imagem local
      description: Alias retrocompatível disponível em /api/v1/onnx-spike/analyze-image
      operationId: analyzeLabImage
      parameters:
        - name: conf
          in: query
          schema:
            type: number
        - name: iou
          in: query
          schema:
            type: number
        - name: runtime
          in: query
          schema:
            type: string
        - name: allowCpuFallback
          in: query
          schema:
            type: boolean
            default: false
        - name: modelId
          in: query
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Resultado da análise da imagem
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageRunResult"
        "400":
          description: Imagem inválida ou parâmetros incorretos
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "503":
          description: Runtime ou checkpoint indisponível
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
  /api/v1/vision-lab/analyze-video:
    post:
      summary: Submeter análise assíncrona de vídeo com tracking opcional
      description: Alias retrocompatível disponível em /api/v1/onnx-spike/analyze-video
      operationId: analyzeLabVideo
      parameters:
        - name: conf
          in: query
          schema:
            type: number
        - name: iou
          in: query
          schema:
            type: number
        - name: sampleFps
          in: query
          schema:
            type: number
        - name: runtime
          in: query
          schema:
            type: string
        - name: allowCpuFallback
          in: query
          schema:
            type: boolean
            default: false
        - name: outputResolution
          in: query
          schema:
            type: string
            enum: [1080p, native]
            default: 1080p
        - name: enableTracking
          in: query
          schema:
            type: boolean
            default: false
        - name: modelId
          in: query
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "202":
          description: Execução de vídeo enfileirada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoRunStatus"
  /api/v1/vision-lab/runs:
    get:
      summary: Listar execuções recentes do Laboratório de Visão
      description: Alias retrocompatível disponível em /api/v1/onnx-spike/runs
      operationId: listLabRuns
      responses:
        "200":
          description: Histórico de execuções locais (inclui histórico Java preservado)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RunListItem"
  /api/v1/vision-lab/runs/{id}:
    get:
      summary: Obter detalhes completos de uma execução do laboratório
      description: Alias retrocompatível disponível em /api/v1/onnx-spike/runs/{id}
      operationId: getLabRun
      parameters:
        - $ref: "#/components/parameters/UuidPathId"
      responses:
        "200":
          description: Resultado detalhado de imagem ou vídeo
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ImageRunResult"
                  - $ref: "#/components/schemas/VideoRunStatus"
  /api/v1/vision-lab/runs/{id}/files/{kind}:
    get:
      summary: Transmitir ou baixar arquivo original ou anotado de uma execução do laboratório
      description: Alias retrocompatível disponível em /api/v1/onnx-spike/runs/{id}/files/{kind}
      operationId: streamLabRunFile
      parameters:
        - $ref: "#/components/parameters/UuidPathId"
        - name: kind
          in: path
          required: true
          schema:
            type: string
            enum: [original, annotated]
        - name: download
          in: query
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Arquivo completo
        "206":
          description: Conteúdo parcial (byte-range)
  /api/v1/vision-lab/compare:
    get:
      summary: Comparar duas execuções do laboratório (deltas de detecção e latência)
      description: Alias retrocompatível disponível em /api/v1/onnx-spike/compare
      operationId: compareLabRuns
      parameters:
        - name: runA
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: runB
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Comparação estruturada A/B entre duas execuções
  /api/v1/vision-lab/runs/{id}/curate-frame:
    post:
      summary: Capturar frame limpo + pré-anotações YOLO para curadoria humana no CVAT
      description: Alias retrocompatível disponível em /api/v1/onnx-spike/runs/{id}/curate-frame
      operationId: curateLabFrame
      parameters:
        - $ref: "#/components/parameters/UuidPathId"
      responses:
        "201":
          description: Pacote salvo em curation-inbox aguardando revisão humana
  /api/v1/annotations/projects:
    get:
      summary: Listar projetos isolados do Annotation Studio
      operationId: listAnnotationProjects
      responses:
        "200":
          description: Lista de projetos de anotação com contadores por status
    post:
      summary: Criar projeto isolado do Annotation Studio
      operationId: createAnnotationProject
      responses:
        "201":
          description: Projeto criado
  /api/v1/annotations/projects/{id}:
    get:
      summary: Obter detalhes do projeto de anotação com filtros de status/busca
      operationId: getAnnotationProject
      parameters:
        - $ref: "#/components/parameters/UuidPathId"
      responses:
        "200":
          description: Detalhes, vídeos e itens do projeto
    delete:
      summary: Excluir workspace isolado do projeto de anotação
      operationId: deleteAnnotationProject
      parameters:
        - $ref: "#/components/parameters/UuidPathId"
      responses:
        "204":
          description: Projeto removido
  /api/v1/annotations/projects/{id}/images:
    post:
      summary: Enviar uma ou múltiplas imagens para anotação
      operationId: uploadAnnotationImages
      parameters:
        - $ref: "#/components/parameters/UuidPathId"
      responses:
        "201":
          description: Imagens validadas e registradas com SHA-256
  /api/v1/annotations/projects/{id}/videos:
    post:
      summary: Enviar vídeo para extração configurável de frames
      operationId: uploadAnnotationVideo
      parameters:
        - $ref: "#/components/parameters/UuidPathId"
      responses:
        "201":
          description: Vídeo validado com metadados técnicos
  /api/v1/annotations/projects/{id}/videos/{videoId}/preview-frames:
    post:
      summary: Gerar miniaturas candidatas deduplicadas para seleção de frames
      operationId: previewAnnotationVideoFrames
      responses:
        "200":
          description: Candidatos com frameIndex, timestampMs e diffScore
  /api/v1/annotations/projects/{id}/videos/{videoId}/extract-frames:
    post:
      summary: Importar frames selecionados em resolução original para o projeto
      operationId: extractAnnotationVideoFrames
      responses:
        "201":
          description: Frames extraídos e registrados
  /api/v1/annotations/projects/{id}/import-curation-inbox:
    post:
      summary: Importar pacotes não duplicados de data/processed/curation-inbox
      operationId: importCurationInboxToProject
      parameters:
        - $ref: "#/components/parameters/UuidPathId"
      responses:
        "200":
          description: Resumo de itens importados
  /api/v1/annotations/projects/{id}/items/{itemId}:
    get:
      summary: Obter detalhes, caixas e proveniência de um item
      operationId: getAnnotationItem
      responses:
        "200":
          description: Detalhe do item
    delete:
      summary: Remover item do projeto de anotação
      operationId: deleteAnnotationItem
      responses:
        "204":
          description: Item removido
  /api/v1/annotations/projects/{id}/items/{itemId}/annotations:
    put:
      summary: Persistir bounding boxes revisadas, confirmação de negativo e status
      operationId: updateItemAnnotations
      responses:
        "200":
          description: Anotações salvas com proveniência humana
  /api/v1/annotations/projects/{id}/items/{itemId}/preannotate:
    post:
      summary: Executar pré-anotação assistida por IA em um item
      operationId: preannotateAnnotationItem
      responses:
        "200":
          description: Item atualizado com sugestões de IA (humanReviewed=false)
  /api/v1/annotations/projects/{id}/preannotate-batch:
    post:
      summary: Executar pré-anotação em lote sobre itens pendentes
      operationId: preannotateAnnotationBatch
      parameters:
        - $ref: "#/components/parameters/UuidPathId"
      responses:
        "200":
          description: Resumo do processamento em lote
  /api/v1/annotations/projects/{id}/export-yolo:
    post:
      summary: Exportar pacote CVAT YOLO 1.1 .zip com trava de revisão humana
      operationId: exportAnnotationProjectYolo
      parameters:
        - $ref: "#/components/parameters/UuidPathId"
      responses:
        "200":
          description: Pacote zip compatível com CVAT YOLO 1.1
        "409":
          description: Nenhum item com revisão humana disponível para exportação
  /api/v1/annotations/projects/{id}/import-yolo:
    post:
      summary: Importar pacote CVAT YOLO 1.1 .zip para o projeto
      operationId: importAnnotationProjectYolo
      parameters:
        - $ref: "#/components/parameters/UuidPathId"
      responses:
        "201":
          description: Imagens e caixas YOLO importadas
  /api/v1/training/overview:
    get:
      summary: Obter visão geral da linha de versões de treinamento, datasets disponíveis e baseline
      operationId: getTrainingOverview
      responses:
        "200":
          description: Estado consolidado da aba Treinamento
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrainingOverview"
  /api/v1/training/runs:
    get:
      summary: Listar execuções de treinamento gerenciadas
      operationId: listTrainingRuns
      responses:
        "200":
          description: Lista de versões treinadas
    post:
      summary: Iniciar nova rodada incremental de treinamento na GPU
      operationId: startTrainingRun
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartTrainingRequest"
      responses:
        "202":
          description: Treinamento enfileirado e iniciado em subprocesso GPU
        "409":
          description: Já existe um treinamento ativo na GPU
  /api/v1/training/runs/{id}:
    get:
      summary: Obter curvas por época (results.csv ao vivo) e logs de uma rodada
      operationId: getTrainingRun
      parameters:
        - $ref: "#/components/parameters/UuidPathId"
      responses:
        "200":
          description: Detalhes e série histórica por época
  /api/v1/training/runs/{id}/stop:
    post:
      summary: Interromper treinamento ativo preservando pesos parciais
      operationId: stopTrainingRun
      parameters:
        - $ref: "#/components/parameters/UuidPathId"
      responses:
        "200":
          description: Treinamento marcado como CANCELLED
  /api/v1/training/runs/{id}/register:
    post:
      summary: Registrar checkpoint best.pt concluído no Model Registry como candidato
      operationId: registerTrainingCheckpoint
      parameters:
        - $ref: "#/components/parameters/UuidPathId"
      responses:
        "201":
          description: Checkpoint registrado em artifacts/models/registry.json
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelCheckpointDto"
components:
  parameters:
    UuidPathId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    HealthResponse:
      type: object
      properties:
        status:
          type: string
        stage:
          type: string
        version:
          type: string
        backend:
          type: string
        storageWritable:
          type: boolean
        dbReachable:
          type: boolean
        defaultRuntime:
          type: string
        cudaAvailable:
          type: boolean
    ActuatorHealthResponse:
      type: object
      properties:
        status:
          type: string
          enum: [UP, DOWN]
        components:
          type: object
    ProblemDetail:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        errorCode:
          type: string
    ProcessInspectionRequest:
      type: object
      properties:
        modelId:
          type: ["string", "null"]
        runtime:
          type: ["string", "null"]
        allowCpuFallback:
          type: boolean
          default: false
        confThreshold:
          type: ["number", "null"]
        iouThreshold:
          type: ["number", "null"]
        sampleFps:
          type: ["number", "null"]
    InspectionSummary:
      type: object
      required: [id, title, status, originalFilename, contentType, fileSizeBytes, sha256Checksum, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        notes:
          type: ["string", "null"]
        status:
          type: string
          enum: [UPLOADED, QUEUED, PROCESSING, COMPLETED, FAILED]
        originalFilename:
          type: string
        contentType:
          type: string
        fileSizeBytes:
          type: integer
          format: int64
        sha256Checksum:
          type: string
        latestJobId:
          type: ["string", "null"]
          format: uuid
        durationMs:
          type: ["integer", "null"]
          format: int64
        wagonCount:
          type: integer
          default: 0
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    InspectionDetail:
      allOf:
        - $ref: "#/components/schemas/InspectionSummary"
        - type: object
          properties:
            widthPx:
              type: ["integer", "null"]
            heightPx:
              type: ["integer", "null"]
            fps:
              type: ["number", "null"]
            codec:
              type: ["string", "null"]
            reviewRequiredCount:
              type: integer
            latestJob:
              oneOf:
                - $ref: "#/components/schemas/ProcessingJobResponse"
                - type: "null"
    ProcessingJobResponse:
      type: object
      required: [id, inspectionId, status, engineType, isDemoSimulation, createdAt]
      properties:
        id:
          type: string
          format: uuid
        inspectionId:
          type: string
          format: uuid
        status:
          type: string
          enum: [QUEUED, RUNNING, COMPLETED, FAILED]
        progressPercent:
          type: ["integer", "null"]
        engineType:
          type: string
        isDemoSimulation:
          type: boolean
        errorCode:
          type: ["string", "null"]
        errorMessage:
          type: ["string", "null"]
        startedAt:
          type: ["string", "null"]
          format: date-time
        finishedAt:
          type: ["string", "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
    WagonResultResponse:
      type: object
      required: [id, inspectionId, jobId, wagonIdentity, loadingEstimate, modelVersions, consolidation, qualityFlags, reviewRequired, reviewReasons, isExample, createdAt]
      properties:
        id:
          type: string
          format: uuid
