[project]
name = "railvision-backend"
version = "0.4.0"
description = "Unified FastAPI backend for RailVision AI."
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic==1.20.1",
    "av==19.0.2",
    "fastapi==0.165.0",
    "psycopg[binary]==3.3.9",
    "pydantic==2.14.4",
    "pydantic-settings==2.16.3",
    "python-multipart==0.0.34",
    "SQLAlchemy==2.1.9",
    "uvicorn==0.54.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "unit: Fast isolated unit tests without GPU or external PostgreSQL dependencies.",
    "integration: Integration tests requiring PostgreSQL Docker container or full video processing.",
    "gpu: Tests requiring NVIDIA CUDA GPU hardware and local raw media/weights.",
]
