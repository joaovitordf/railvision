[project]
name = "railvision-ml"
version = "0.1.0"
description = "Offline dataset audit, training, evaluation, and ONNX export tooling for RailVision AI."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.optional-dependencies]
audit = [
    "numpy==2.5.5",
    "opencv-python-headless==5.1.0.95",
    "pillow==13.0.0",
    "pytest==9.2.0",
    "requests==2.34.2",
]
train = [
    "lap==0.5.14",
    "matplotlib==3.11.2",
    "nvidia-ml-py==13.615.71",
    "opencv-python==5.1.0.95",
    "torch==2.9.1+cu128",
    "torchvision==0.24.1+cu128",
    "ultralytics==8.4.215",
]
onnx = [
    "onnx==1.23.2",
    "onnxruntime==1.32.0",
]
backend = [
    "alembic==1.20.1",
    "av==19.0.2",
    "fastapi==0.165.0",
    "psycopg[binary]==3.3.9",
    "pydantic==2.14.4",
    "pydantic-settings==2.16.3",
    "python-multipart==0.0.34",
    "SQLAlchemy==2.1.9",
    "uvicorn==0.54.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
